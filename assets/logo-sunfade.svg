    <path d="M100 16 C105 28, 95 36, 104 49 L95 49 C89 37, 96 28, 100 16 Z"/>
    <path d="M100 16 C105 28, 95 36, 104 49 L95 49 C89 37, 96 28, 100 16 Z" transform="rotate(25.71 100 100)"/>
    <path d="M100 16 C105 28, 95 36, 104 49 L95 49 C89 37, 96 28, 100 16 Z" transform="rotate(51.43 100 100)"/>
    <path d="M100 16 C105 28, 95 36, 104 49 L95 49 C89 37, 96 28, 100 16 Z" transform="rotate(77.14 100 100)"/>
    <path d="M100 16 C105 28, 95 36, 104 49 L95 49 C89 37, 96 28, 100 16 Z" transform="rotate(102.86 100 100)"/>
    <path d="M100 16 C105 28, 95 36, 104 49 L95 49 C89 37, 96 28, 100 16 Z" transform="rotate(128.57 100 100)"/>
    <path d="M100 16 C105 28, 95 36, 104 49 L95 49 C89 37, 96 28, 100 16 Z" transform="rotate(154.29 100 100)"/>
    <path d="M100 16 C105 28, 95 36, 104 49 L95 49 C89 37, 96 28, 100 16 Z" transform="rotate(180 100 100)"/>
    <path d="M100 16 C105 28, 95 36, 104 49 L95 49 C89 37, 96 28, 100 16 Z" transform="rotate(205.71 100 100)"/>
