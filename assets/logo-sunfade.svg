    <path d="M100 16 C105 28, 95 36, 104 49 L95 49 C89 37, 96 28, 100 16 Z" transform="rotate(257.14 100 100)"/>
    <path d="M100 16 C105 28, 95 36, 104 49 L95 49 C89 37, 96 28, 100 16 Z" transform="rotate(282.86 100 100)"/>
    <path d="M100 16 C105 28, 95 36, 104 49 L95 49 C89 37, 96 28, 100 16 Z" transform="rotate(308.57 100 100)"/>
    <path d="M100 16 C105 28, 95 36, 104 49 L95 49 C89 37, 96 28, 100 16 Z" transform="rotate(334.29 100 100)"/>
  </g>

  <!-- Anillo central del sol -->
  <circle cx="100" cy="100" r="48" fill="#121211" stroke="#F7F3EB" stroke-width="8.5"/>

  <!-- Letra 'S' retro surf en el centro -->
  <path d="M114 81 C114 73, 106 69, 98 69 C88 69, 81 75, 81 84 C81 93, 89 96, 99 99 C108 102, 113 105, 113 113 C113 121, 106 126, 97 126 C88 126, 82 121, 82 114"
        stroke="#F7F3EB" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="114" cy="81" r="4.5" fill="#F7F3EB"/>
  <circle cx="82" cy="114" r="4.5" fill="#F7F3EB"/>
</svg>

